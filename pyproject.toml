[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hawksense"
version = "0.1.0"
description = "Smart price tracker: landed cost across Israeli and worldwide stores, with sales-day aware buy/wait advice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hawksense = "hawksense.cli:main"

[tool.setuptools]
packages = ["hawksense"]

[tool.setuptools.package-data]
hawksense = ["web/*", "web/icons/*"]
