# Self-hosted HawkSense.
#
#   cp .env.example .env        # set HAWKSENSE_TOKEN (and HAWKSENSE_DOMAIN for HTTPS)
#   docker compose up -d                     # http://<server>:8765
#   docker compose --profile https up -d     # + Caddy with automatic HTTPS (needed for iOS offline mode)
#
# Data (SQLite) lives in the "hawksense-data" volume. Backup:
#   docker compose exec hawksense hawksense backup /data/backups

services:
  hawksense:
    build: .
    image: hawksense:latest
    restart: unless-stopped
    env_file:   # passes notification secrets etc. from .env (HAWKSENSE_TELEGRAM_BOT_TOKEN, ...)
      - path: .env
        required: false
    environment:
      HAWKSENSE_TOKEN: ${HAWKSENSE_TOKEN:?set HAWKSENSE_TOKEN in .env}
      HAWKSENSE_CHECK_EVERY: ${HAWKSENSE_CHECK_EVERY:-6}   # hours between automatic price checks
      HAWKSENSE_DEST: ${HAWKSENSE_DEST:-IL}                 # IL, US, EU or UK
      HAWKSENSE_BASE_PATH: ${HAWKSENSE_BASE_PATH:-}
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - hawksense-data:/data
      # optional overrides: taxes, stores, forwarders, eBay keys, notification channels:
      # - ./config.toml:/data/config.toml:ro
    ports:
      - "${HAWKSENSE_BIND:-0.0.0.0}:${HAWKSENSE_PORT:-8765}:8765"

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      hawksense:
        condition: service_healthy
    environment:
      HAWKSENSE_DOMAIN: ${HAWKSENSE_DOMAIN:-hawksense.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  hawksense-data:
  caddy-data:
  caddy-config:
