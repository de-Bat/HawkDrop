<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HawkSense</title>
  <meta name="description" content="Smart price tracker: delivered prices across Israeli and worldwide stores, and when to buy.">
  <meta name="theme-color" content="#052c58" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#061a36" media="(prefers-color-scheme: dark)">
  <!-- iOS home-screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HawkSense">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest" id="manifest-link">
  <link rel="stylesheet" href="styles.css">
  <script src="boot.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><img src="icons/favicon-32.png" alt="" width="24" height="24"> HawkSense</a>
    <div class="top-right"><a id="bell" class="icon-btn bell" href="#/inbox" aria-label="Notifications"></a><div id="status"></div></div>
  </header>
  <main id="view" class="container">
    <noscript><p>HawkSense needs JavaScript.</p></noscript>
  </main>
  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="list" aria-label="Items"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span><span>Items</span></a>
    <a href="#/add" data-tab="add" aria-label="Track"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>Track</span></a>
    <a href="#/events" data-tab="events" aria-label="Sales days"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span><span>Sales days</span></a>
    <a href="#/settings" data-tab="settings" aria-label="Settings"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2 1.2M17.8 15.3l2 1.2M4.2 16.5l2-1.2M17.8 8.7l2-1.2"/></svg><i class="tab-dot" id="settings-tab-dot" hidden></i></span><span>Settings</span></a>
  </nav>
  <div id="sheet" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
